user crm;
worker_processes 1;
pid /opt/crm/shared/nginx.pid;
error_log /opt/crm/logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
  include /opt/crm/nginx/conf/mime.types;
  default_type application/octet-stream;
  access_log /opt/crm/logs/nginx-access.log;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;
  server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /opt/crm/acme; default_type text/plain; }
    location / { return 308 https://__PUBLIC_IP__$request_uri; }
  }
  server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    ssl_certificate /etc/letsencrypt/live/crm-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    location / {
      proxy_pass http://127.0.0.1:3003;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 180s;
    }
  }
}
