# Electron 打包配置
# 产物目录：release/
appId: com.crm.admin
productName: CRM-Admin
directories:
  output: release

# 主进程只依赖 Electron 内置模块，无需打包 node_modules；
# 服务端依赖已由 Next standalone 自包含，通过 extraResources 注入 resources/
files:
  - electron/**
  - package.json
  - "!node_modules/**"

# Next standalone 服务：由主进程从 resources/standalone/server.js 拉起
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
  # 根 node_modules 被 electron-builder 硬排除（见 app-builder-lib filter.js），
  # 只能单独作为 from 根拷贝
  - from: .next/standalone/node_modules
    to: standalone/node_modules
    filter:
      - "**/*"
      # sharp / @img 是 Next 的图片优化依赖，16MB 且是本机 macOS 的二进制，
      # 放进 Windows 包里既没用也加载不了。全项目没有用到 next/image，直接排除。
      # （以后真要用 next/image，把这两行去掉，并改用目标平台的 sharp 二进制）
      - "!@img/**"
      - "!sharp/**"
  # 静态资源：Next standalone 输出不包含 .next/static 与 public，需手动补齐
  - from: .next/static
    to: standalone/.next/static
    filter:
      - "**/*"
  - from: public
    to: standalone/public
    filter:
      - "**/*"

# better-sqlite3 由构建流程里的 electron-rebuild 针对 Electron ABI 重建，
# 关闭 electron-builder 自带的 npmRebuild，避免重复编译
npmRebuild: false

# 打包体积：最高压缩档 + 打包后裁掉用不到的 Chromium 大件（多余语言包、WebGPU 编译器）
compression: maximum
afterPack: scripts/prune-electron-dist.mjs

mac:
  # 无开发者证书，跳过签名（应用分发前需补签名与公证）
  identity: null
  target:
    - dmg
    - zip
  category: public.app-category.business

win:
  target:
    # portable：单个 exe，双击即用，不走安装程序。代价是每次启动都要把
    # 自己解压到 %TEMP%，首次启动慢几秒，且解压过程会被杀毒软件盯上
    - target: portable
      arch:
        - x64
    # zip：解压一次、直接点 exe 跑，没有自解压环节。
    # 同样不需要安装程序，但比 portable 稳 —— 出问题时优先用这个
    - target: zip
      arch:
        - x64
  requestedExecutionLevel: asInvoker

portable:
  artifactName: ${productName}-${version}-portable-x64.exe
  # 不要固定 unpackDirName：固定之后 portable 会复用 %TEMP% 里的旧目录，
  # 万一首次解压被杀毒软件 / 磁盘空间打断，之后每次启动都在用那份残缺的副本，
  # 表现就是服务起来了但请求 500。让它每次干净解压，牺牲几秒换确定性

linux:
  target:
    - AppImage
